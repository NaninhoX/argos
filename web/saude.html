<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Saúde do Termômetro | Argos Sentinel</title>
<meta name="description" content="Painel interno: contagens e alertas do registro prospectivo do Argos Sentinel. Exige o código de acesso.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<style>
  /* Tema copiado de web/verificar.html. Página interna: o código de acesso fica só na memória da aba (nunca é salvo). */
  :root {
    --bg: #0D1420; --bg-elevated: #141E2C; --navy: #1E2A3A; --navy-line: #2A3A4E;
    --gold: #B08D3E; --gold-bright: #D4B15C; --ink: #E8E3D8; --ink-dim: #9BA4B2; --ink-faint: #5E6B7C;
    --red: #C4544A; --green: #5FA37E; --red-text: #E0857B;
    --serif: 'Source Serif 4', Cambria, Georgia, serif; --mono: 'JetBrains Mono', 'Courier New', monospace;
    color-scheme: dark; box-sizing: border-box;
  }
  * { box-sizing: inherit; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; background: var(--bg); -webkit-font-smoothing: antialiased; }
  body { color: var(--ink); font-family: var(--serif); font-size: 17px; line-height: 1.55; padding-bottom: env(safe-area-inset-bottom, 0px); }
  code { font-family: var(--mono); font-size: 0.88em; overflow-wrap: anywhere; }
  .wrap { max-width: 920px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
  h1 { font-size: 30px; line-height: 1.2; font-weight: 600; margin: 32px 0 8px; }
  .intro { color: var(--ink-dim); font-size: 15px; margin: 0 0 16px; max-width: 66ch; }
  .card { background: var(--bg-elevated); border: 1px solid var(--navy-line); border-radius: 6px; padding: 18px; margin: 16px 0; }
  .card h2 { font: 600 12px/1.4 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-bright); margin: 0 0 12px; }
  .lookup { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; max-width: 460px; }
  .lookup label { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-dim); }
  .lookup input { width: 100%; min-height: 44px; padding: 10px 12px; font-family: var(--mono); font-size: 14px; color: var(--ink); background: var(--bg-elevated); border: 1px solid var(--navy-line); border-radius: 4px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 14px; font-family: var(--mono); font-size: 12.5px; color: var(--gold-bright); background: transparent; border: 1px solid var(--gold); border-radius: 3px; cursor: pointer; }
  .btn:hover { background: var(--gold); color: var(--bg); }
  .btn.quiet { border-color: var(--navy-line); color: var(--ink-dim); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .msg { margin: 16px 0; padding: 12px 14px; border: 1px solid var(--navy-line); border-radius: 4px; background: var(--bg-elevated); color: var(--ink-dim); }
  .msg:empty { display: none; }
  .msg.erro { border-color: var(--red); color: var(--red-text); }
  .banner { border: 1px solid var(--navy-line); border-left-width: 4px; border-radius: 4px; padding: 12px 14px; margin: 16px 0; }
  .banner strong { display: block; font-size: 20px; }
  .banner.ok { border-color: var(--green); } .banner.ok strong { color: var(--green); }
  .banner.atencao { border-color: var(--gold); } .banner.atencao strong { color: var(--gold-bright); }
  .alerts { margin: 0; padding-left: 18px; color: var(--red-text); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .num { border: 1px solid var(--navy-line); border-radius: 4px; padding: 10px 12px; }
  .num b { display: block; font-family: var(--mono); font-size: 24px; color: var(--ink); }
  .num span { font-size: 13px; color: var(--ink-dim); }
  .tw { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 12.5px; }
  th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--navy-line); white-space: nowrap; }
  th { color: var(--ink-dim); font-weight: 600; }
  .dim { color: var(--ink-dim); } .small { font-size: 14px; }
</style>
</head>
<body>
<main class="wrap">
  <h1>Saúde do Termômetro</h1>
  <p class="intro">Painel interno do registro prospectivo: quantas previsões foram gravadas, quantas já têm desfecho e se algo ficou parado. Só contagens e datas. Digite o código de acesso do Argos; ele não é salvo nem enviado a ninguém além do servidor.</p>
  <form class="lookup" id="form" autocomplete="off">
    <label for="code">Código de acesso</label>
    <input id="code" type="password" autocomplete="off" required>
    <div class="actions"><button class="btn" type="submit">Consultar</button><button class="btn quiet" type="button" id="refresh" hidden>Atualizar</button></div>
  </form>
  <div class="msg" id="msg" role="status"></div>
  <div id="out" hidden></div>
</main>
<script type="module" src="js/saude.js"></script>
</body>
</html>
